on:
  push:
    branches:
      - master
  workflow_dispatch:
name: 🚀 Build
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node version
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build 🔨
        run: |
          npm ci
          npm test -- --run
          npm run build

      # TODO: add deploy step once hosting is decided (see EmberInstruments main.yml for the rsync pattern)
